<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这里什么都没有 · 比企谷八幡</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F100F'/%3E%3Crect x='4' y='15' width='24' height='2.6' fill='%23A85436'/%3E%3C/svg%3E">
<style>
/* 刻意不加载子集字体：一个 404 不值得为它拉 576KB 字体，用系统衬线兜底。 */
:root{--ink:#0F100F;--text:#E4DFD5;--dim:#8A8278;--rust:#A85436}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--ink);color:var(--text);
  font-family:'Songti SC','Noto Serif SC',serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(40px,8vw,90px) 24px;gap:0}
.mark{width:52px;height:3px;background:var(--rust);opacity:.85;margin-bottom:clamp(40px,6vh,64px)}
h1{font-weight:900;font-size:clamp(28px,5.2vw,58px);line-height:1.32;
  letter-spacing:-.045em;max-width:14em}
p{font-weight:300;font-size:clamp(14px,1.7vw,17px);line-height:2.05;color:var(--dim);
  margin-top:clamp(26px,4vh,38px);max-width:22em}
a{display:inline-block;margin-top:clamp(40px,6vh,60px);
  font-size:13px;letter-spacing:.22em;color:var(--text);text-decoration:none;
  border-bottom:1px solid var(--rust);padding:6px 2px 8px;
  transition:color .4s cubic-bezier(.16,1,.3,1),opacity .4s cubic-bezier(.16,1,.3,1)}
a:hover,a:focus-visible{color:var(--rust)}
a:focus-visible{outline:2px solid var(--rust);outline-offset:6px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"></div>
  <h1>这里什么都没有。</h1>
  <p>你要找的页面不存在，或者已经被改掉了。</p>
  <a href="/">回 到 开 头</a>
</body>
</html>
